name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: acta verify-vault
      - run: acta preview          # compiles a real PDF via the python typst binding
      - uses: actions/upload-artifact@v4
        with: { name: preview-pdf, path: docs/archive/*.pdf }
