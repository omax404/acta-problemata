<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acta Problemata — Request a sheet</title>
<style>body{margin:0;background:#dcd7cf;color:#151515;font:16px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
main{width:min(520px,92vw);border-left:3px solid #e8500c;padding:8px 24px}h1{font-weight:300;text-transform:uppercase;letter-spacing:.04em}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 14px;border:1px solid #151515;background:#fff;font:inherit}
button{background:#e8500c;border:0;font-weight:700;cursor:pointer}small{color:#444}</style></head><body><main>
<h1>Acta Problemata</h1>
<p>Paste a link to a public page about an industrial problem. We turn it into a one-page engineering sheet and email you the PDF.</p>
<form id="f"><label>Link<input name="url" type="url" required placeholder="https://…"></label>
<label>Your email<input name="email" type="email" required></label>
<label>Domain<select name="domain"><option value="">Auto</option><option>Mechanical</option><option>Thermodynamics</option><option>Fluids</option><option>Materials</option><option>Electrical</option><option>Civil</option></select></label>
<button>Send me the PDF</button></form><p id="m"></p>
<small>Realistic problem adapted from the page; company details are removed. Your email is used once to send the PDF.</small>
<script>const WORKER="https://REPLACE-ME.workers.dev";
f.onsubmit=async e=>{e.preventDefault();m.textContent="Sending…";try{const r=await fetch(WORKER,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
m.textContent=r.ok?"Queued — the PDF arrives by email in a few minutes (check spam).":"Refused: "+await r.text()}catch{m.textContent="Network error."}}</script>
</main></body></html>
