name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: ruff check src tests
      - run: pytest -q
      - run: acta verify-vault
      - run: node --test extras/worker/worker.test.mjs
      - run: acta sheet today --out build/today.pdf
      - run: acta carousel today --out build/carousel
      - run: acta preview          # compiles a real PDF via the python typst binding
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: preview-pdf, path: docs/gazette/archive/*.pdf }
