name: Sources check
# Manual: run this once from GitHub (open internet) to see which sources are reachable and allowed
# by robots.txt BEFORE you enable any of them in data/sources.json.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e .
      - name: Probe sources
        run: acta sources-check | tee "$GITHUB_STEP_SUMMARY"
